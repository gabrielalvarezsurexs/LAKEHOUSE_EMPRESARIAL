# Responsable: Gabriel Alvarez Mendoza (Arquitecto de Datos / Lider)
# Logs de Spark (log4j2). Se carga por SPARK_CONF_DIR (docker-compose.yml). Solo WARN o mas grave, y se callan
# dos avisos que en modo local no significan nada: sin libreria nativa de Hadoop y sin archivo de metricas S3A.

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error

logger.s3ametrics.name = org.apache.hadoop.metrics2.impl.MetricsConfig
logger.s3ametrics.level = error
