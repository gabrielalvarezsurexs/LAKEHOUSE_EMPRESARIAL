# Responsable: Gabriel Alvarez Mendoza (Arquitecto de Datos / Lider)
# Stack local del lakehouse (D1). Uso: copia .env.example a .env y corre `docker compose up -d --build`.
# F5: Dagster corre en el contenedor lakehouse (localhost:3300) y MLflow aparte (5000); F7 agrega Superset.
# Necesita en .env las MINIO_SECRET_* (README, paso 1).

name: lakehouse

# Contrasenas de los usuarios de servicio de MinIO (D17): minio-init los crea y el lakehouse los usa.
x-service-secrets: &service-secrets
  MINIO_SECRET_INGESTION: ${MINIO_SECRET_INGESTION:?Falta MINIO_SECRET_INGESTION en .env (README paso 1)}
  MINIO_SECRET_TRANSFORMATION: ${MINIO_SECRET_TRANSFORMATION:?Falta MINIO_SECRET_TRANSFORMATION en .env}
  MINIO_SECRET_GOVERNANCE: ${MINIO_SECRET_GOVERNANCE:?Falta MINIO_SECRET_GOVERNANCE en .env}
  MINIO_SECRET_ML: ${MINIO_SECRET_ML:?Falta MINIO_SECRET_ML en .env}
  MINIO_SECRET_BI: ${MINIO_SECRET_BI:?Falta MINIO_SECRET_BI en .env}

services:
  minio:
    # MinIO ya no publica imagenes libres (Docker Hub oct 2025, quay.io sep 2026). Usamos la de Chainguard,
    # fijada por digest (build del 2026-11-22) para que nunca cambie sin que lo decidamos (D2).
    image: cgr.dev/chainguard/minio@sha256:548147b5fc95a67e3e45285dff7e0e50326c3eb1977c6218039461771156c5e7
    command: ["server", "/data", "--console-address", ":9001"]
    # La imagen corre como 65532 y el volumen nuevo nace de root: sin esto MinIO no puede escribir.
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Falta MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Falta MINIO_ROOT_PASSWORD en .env}
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # consola web
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    # Variante -dev porque trae shell para correr init.sh; tambien fijada por digest.
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:9751bbefa7fa338f5f1fedd1682b3df80134aa0546c3bf91bbbf0976cda7d730
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      <<: *service-secrets
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MC_CONFIG_DIR: /tmp/mc
    volumes:
      - ./infra/minio:/init:ro
    depends_on:
      minio:
        condition: service_started
    restart: "no"

  lakehouse:
    build:
      context: .
      dockerfile: infra/app/Dockerfile
    image: lakehouse-app:local
    # tini como PID 1: recoge los procesos java de Spark que terminan (si no, quedan <defunct>; H-011).
    init: true
    # Solo las variables que necesita; nunca el .env completo (minimo privilegio).
    environment:
      # Sin el root de MinIO: cada comando entra con el usuario de su rol (svc-ingestion, ...; D17).
      <<: *service-secrets
      S3_ENDPOINT: http://minio:9000
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-4g}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUN_SPARK_TESTS: "1"
      # log4j2.properties de infra/app/spark-conf: menos ruido en la consola de Spark.
      SPARK_CONF_DIR: /opt/spark-conf
      # Ingesta (F2): la sal la valida el codigo (falla con mensaje claro si falta o es corta).
      IP_HASH_SALT: ${IP_HASH_SALT:-}
      SPOTIFY_SOURCE_DIR: /datos_spotify
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:-}
      # Gobernanza (F4): el reporte de calidad se escribe directo en el repo (solo conteos).
      REPORT_DIR: /app/reports
      # Orquestacion (F5): generos de la API real (default) o sinteticos (CI y replica sin datos reales).
      GENRES_SOURCE: ${GENRES_SOURCE:-api}
      # ML (F6): servidor de experimentos y carpeta del reporte del modelo (solo metricas agregadas).
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ML_REPORT_DIR: /app/reports_ml
    ports:
      # Dagster (UI, linaje, corridas) en http://localhost:3300; el 3000 suele estar ocupado (Grafana, etc.).
      - "${DAGSTER_PORT:-3300}:3000"
      - "4040:4040"  # Spark UI (mientras corre un paso)
    volumes:
      # Codigo montado: los cambios se ven sin reconstruir la imagen (solo si cambia uv.lock).
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./infra/app/spark-conf:/opt/spark-conf:ro
      # Datos reales de Spotify, solo lectura (F2). Nunca se copian a la imagen.
      - ${SPOTIFY_DATA_DIR:-./DATOS_SPOTIFY}:/datos_spotify:ro
      # Carpetas del repo con escritura: CALIDAD_Y_LINAJE.md (F4) y ML_METRICAS.md con sus graficas (F6).
      - ./ENTREGABLES/03_calidad_y_linaje:/app/reports
      - ./ENTREGABLES/04_modelo_ml:/app/reports_ml
      # Historial de Dagster (corridas, cursores de sensores) y su configuracion (F5).
      - dagster-home:/opt/dagster/home
      - ./infra/dagster/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/server_info"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      minio-init:
        condition: service_completed_successfully
      # La primera corrida automatica ya entrena y registra el modelo (F6).
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    # Servidor de experimentos para F6 (D12). Imagen oficial fijada por digest (v3.18.0, 2026-11-04).
    image: ghcr.io/mlflow/mlflow:v3.18.0@sha256:257204c77980b0f3450a26eb6089e487603fcdd4509529eadaf88f90669f5c13
    # Metadatos en SQLite y artefactos en el volumen; el servidor los sirve por HTTP (--serve-artifacts),
    # asi el cliente no necesita llaves de MinIO. --allowed-hosts: MLflow 3 rechaza Host desconocidos.
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  minio-data:
  dagster-home:
  mlflow-data:
